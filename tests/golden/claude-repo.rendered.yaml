# =============================================================================
# claude-repo.yaml - per-repo Claude Code sandbox VM template.
#
# DO NOT start this file directly. `ptrbox new` renders it - substituting the
# double-underscore placeholders and inlining vm/provision/*.sh at the INCLUDE
# markers - writes the result to ~/.lima/_generated/<name>.yaml, and starts
# THAT. This
# file plus vm/provision/ is the single source of truth for what every sandbox
# VM contains; to change all future VMs, edit here and re-create.
#
# LIFECYCLE (why the firewall isn't just "on"):
#   Boot 1: Lima runs the provision scripts below, top to bottom. Network is
#           OPEN during this boot - the installers (nvm, uv, Claude Code)
#           download from hosts deliberately NOT on the Squid allowlist. The
#           firewall is written to disk and enabled (registered to start on
#           boot) but NOT started.
#   Reboot: performed by `ptrbox new`. systemd starts sandbox-firewall.service,
#           and from this moment the VM has default-deny egress.
#   IMPORTANT: Lima installs provision scripts as PER-BOOT scripts - they run
#           again on EVERY boot, including post-firewall ones. Unguarded, the
#           re-run hangs on network calls until cloud-init fails (~10 min) and
#           limactl start times out. Hence the done-marker guards in each
#           script: after boot 1, re-runs exit in milliseconds.
#   Steady state: the only ways out are the host Squid proxy and DNS.
# =============================================================================

# --- Virtual hardware --------------------------------------------------------

vmType: "vz"            # Which backend does the virtualization. "vz" = Apple's
                        # Virtualization.framework: native on Apple Silicon,
                        # fastest, and required for the virtiofs mounts and
                        # vzNAT networking used below. The alternative ("qemu")
                        # is only needed for exotic cases like emulating x86.
cpus: 4          # Virtual cores. Not reserved - only consumed when the
                        # VM is actually computing.
memory: "8GiB"    # A ceiling, not an immediate allocation - but a busy
                        # VM will genuinely hold most of it. If you run several
                        # VMs at once on a 16GB Mac, THIS is the resource to
                        # watch (disk is sparse; RAM is only semi-lazy).
disk: "50GiB"        # Sparse file: the VM sees the full size, but the
                        # host-side file (~/.lima/<name>/diffdisk) only occupies
                        # what has actually been written (~4-5GB after
                        # provisioning). A generous ceiling costs nothing;
                        # running out of virtual disk mid-build is annoying.
mountType: "virtiofs"   # How host directories are shared into the guest.
                        # virtiofs is the fastest option and vz-only. Caveat:
                        # inotify (file-change events) doesn't cross it when
                        # the HOST edits files - see docs/operations.md.

# Lima installs containerd/nerdctl (container tooling) by default - a 250MB
# download plus boot-time setup we never use in these VMs. Disabling it also
# shortens the boot-script window that counts against limactl start's timeout.
containerd:
  system: false
  user: false

# --- Guest OS image ----------------------------------------------------------
# What the VM boots. Required field - a from-scratch config must bring its own
# image (we deliberately don't inherit via "base:", because that would also
# pull in default mounts, including the home-directory mount this design exists
# to exclude).
#
# Chosen by PTRBOX_DISTRO. Default is Debian 13 (trixie) genericcloud: leaner
# than Ubuntu's cloud image (~330MB vs ~590MB) and no snap machinery.
# PTRBOX_DISTRO=ubuntu2404 gets Ubuntu 24.04 LTS instead - same package manager
# and, since the time_t transition, the same package names, so the provisioning
# scripts are unchanged. Both URLs track the current patched build, so fresh
# VMs pick up security updates without touching this file.

images:
  - location: "https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-arm64.qcow2"
    arch: "aarch64"

# --- Filesystem exposure -----------------------------------------------------
# THE core security decision of the whole design. Lima's historic default was
# to mount your entire home directory into the VM - which would hand the agent
# ~/.ssh, ~/.aws, Documents, Photos. Declaring mounts explicitly means ONLY
# what is listed below exists inside the VM.

mounts:
  - location: "/Users/example/code/demo"        # Host path; ptrbox substitutes it.
    mountPoint: "/workspace"        # Fixed, guest-home-agnostic path. Lima's
                                    # guest home naming has changed across
                                    # versions (/home/<user>.linux ->
                                    # /home/<user>.guest), so nothing here
                                    # depends on it.
    writable: true                  # Two-way: agent edits appear on the Mac
                                    # instantly, and vice versa. This is also
                                    # why secrets must NEVER be written under
                                    # the project - they'd land on the host
                                    # and in git.

# --- Host -> VM connectivity -------------------------------------------------
# Forwards guest ports to the Mac's localhost, so a dev server bound in the VM
# on 0.0.0.0:5173 is reachable in your Mac browser at localhost:5173. The
# default range covers common dev ports: vite (5173), CRA/Next (3000), Flask
# (5000), Django (8000). This forwards host->guest connections only; it does
# not expose the VM to your LAN.

portForwards:
  - guestPortRange: [3000, 9000]
    hostPortRange: [3000, 9000]

# --- SSH hygiene -------------------------------------------------------------

ssh:
  forwardAgent: false   # Agent forwarding would let processes in the VM ask
                        # your Mac's ssh-agent to sign with YOUR private keys
                        # (push to GitHub as you, log in as you) without ever
                        # seeing the key material. Exactly the capability an
                        # injected agent must not have. Keep false.

# --- Provisioning ------------------------------------------------------------
# Lima installs these as PER-BOOT scripts - they run on every boot, in order:
# all "system" scripts (as root) first, then all "user" scripts (as the
# unprivileged default user). Each script carries its own done-marker guard.
#
# Note the ordering consequence: 90-nosudo is mode:system, so it executes
# BEFORE the user scripts - fine, since they never call sudo and all
# root-level work is already done by then.

provision:
  - mode: system
    script: |
      #!/bin/bash
      # =============================================================================
      # 10-base.sh - OS packages. Runs as root inside the guest, on EVERY boot.
      #
      # APT-FAMILY ONLY. This script is shared by every supported distro
      # (PTRBOX_DISTRO: debian13, ubuntu2404) because both are apt-based and, since
      # Debian's time_t transition, use identical package names - including the t64
      # suffixes below, which are the same on trixie and noble. Supporting a dnf or
      # pacman distro means a sibling script selected by distro, not edits here.
      #
      # Rendered into the generated Lima config; never executed on the host.
      # Network is open while this runs (the firewall is enabled but not started
      # until the post-provision reboot), which is why the done-marker guard matters:
      # without it, post-firewall boots would hang here until cloud-init gives up.
      # =============================================================================
      set -eux

      # -e: stop on first error. -u: error on unset variables. -x: echo each command
      # (shows up in `journalctl -u cloud-final` inside the guest).

      if [ -f /var/lib/ptrbox/base.done ]; then
        exit 0
      fi

      export DEBIAN_FRONTEND=noninteractive # apt must never prompt in a script

      apt-get update
      # Apply current security patches at provision time. Lima's image cache is
      # keyed by URL and never expires, so the cached base image goes stale - this
      # line is what actually keeps fresh VMs patched.
      apt-get upgrade -y

      # curl/git: installers + cloning.  build-essential: gcc/make, needed when npm
      # or pip packages compile native extensions.  ca-certificates: TLS trust roots
      # so https works at all.  jq: JSON wrangling in shell.  nftables: the firewall
      # itself.  tmux: long-running agent sessions that survive ssh disconnects.
      apt-get install -y curl git build-essential ca-certificates jq nftables tmux

      # Chromium runtime dependencies (Playwright headless browser testing). This is
      # what `npx playwright install-deps chromium` would install - listed explicitly
      # because the VM has no root post-provision, so anything the agent's toolchain
      # needs at the OS level must be baked in here. (t64 suffixes come from Debian's
      # time_t transition; if apt errors on one, the non-t64 name is the fallback.)
      apt-get install -y libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 \
        libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
        libxfixes3 libxrandr2 libgbm1 libasound2t64 libatspi2.0-0t64 \
        libx11-xcb1 libxcursor1 libgtk-3-0t64 fonts-liberation

      mkdir -p /var/lib/ptrbox
      touch /var/lib/ptrbox/base.done

  - mode: system
    script: |
      #!/bin/bash
      # =============================================================================
      # 15-extra-packages.sh - user-configured apt packages. Runs as root inside the
      # guest, on EVERY boot.
      #
      # The list is substituted in at render time from HOST-side config
      # (PTRBOX_EXTRA_PACKAGES in ~/.config/ptrbox/config, or the environment) and
      # validated on the host first. Deliberately never read from a file at boot,
      # and especially not from the repo mount: a repo-provided package list would
      # let the agent install software into its own sandbox. Which packages exist in
      # a VM stays a human, host-side decision.
      #
      # A separate script rather than an edit surface in 10-base.sh, so per-user
      # additions never mean forking the shared base list. Changing the list means
      # re-creating the VM, like every other provisioning change.
      #
      # The host can only validate the SHAPE of a name; whether trixie has a package
      # called that is a question only apt can answer, and only in here. A name that
      # is well-formed but wrong - a typo, a package that exists on noble and not on
      # trixie, a runtime whose Debian name is not what anyone guesses - used to fail
      # inside this script on boot 1, where nobody is watching: `ptrbox new` still
      # printed that the VM was ready, and the missing tool turned up days later as
      # something that could not run. So each failure now leaves a marker file, and
      # vm/verify.sh turns that marker into a failed check, which fails `ptrbox new`.
      # =============================================================================
      set -eux

      # An argument with the real path as its default, purely so the test suite can
      # run this for real against a stub apt - ptrbox passes nothing.
      state="${1:-/var/lib/ptrbox}"
      done_marker="$state/extra-packages.done"
      fail_marker="$state/extra-packages.failed"

      if [ -f "$done_marker" ]; then
        exit 0
      fi

      export DEBIAN_FRONTEND=noninteractive # apt must never prompt in a script

      # Rendered from host config; empty when no extra packages are configured.
      EXTRA_PACKAGES=""

      mkdir -p "$state"
      # Cleared first, so the marker always describes THIS boot. The script has no
      # done marker until it succeeds, so a failed boot 1 re-runs on the reboot that
      # raises the firewall - and every step below works off the package lists on
      # disk, so that re-run needs no network and reaches the same verdict.
      rm -f "$fail_marker"

      # fail records why, then stops the boot script. The marker is what survives to
      # be read: this script's own exit status is lost in cloud-init's log.
      fail() {
        printf '%s\n' "$1" >"$fail_marker"
        printf 'ptrbox: extra packages: %s\n' "$1" >&2
        exit 1
      }

      if [ -n "$EXTRA_PACKAGES" ]; then
        # Resolve every name BEFORE installing any of them, so a typo in the third
        # package does not leave the first two installed and the VM half-configured.
        # --simulate resolves against the lists on disk (no network) and covers more
        # than existence: a version pin that matches nothing, or a dependency that
        # cannot be satisfied on this suite, fails here too.
        #
        # No apt-get update here: 10-base.sh ran one moments earlier in this same
        # boot (both scripts only do real work on boot 1, before their done markers
        # exist).
        unresolved=""
        for pkg in $EXTRA_PACKAGES; do
          if ! apt-get install -y --simulate "$pkg" >/dev/null 2>&1; then
            unresolved="$unresolved $pkg"
          fi
        done
        if [ -n "$unresolved" ]; then
          fail "no such package on this distro:$unresolved (check the name for this suite)"
        fi

        # shellcheck disable=SC2086  # word splitting is the point: one arg per package
        if ! apt-get install -y $EXTRA_PACKAGES; then
          fail "apt-get install failed for: $EXTRA_PACKAGES"
        fi

        # Belt and braces: resolvable and apt-get happy still is not installed. This
        # is the check that holds whatever the reason - a mirror that went away
        # mid-install, a postinst that failed - because it asks dpkg the question the
        # user actually cares about.
        absent=""
        for pkg in $EXTRA_PACKAGES; do
          status="$(dpkg-query -W -f='${db:Status-Status}' "${pkg%%=*}" 2>/dev/null || true)"
          if [ "$status" != installed ]; then
            absent="$absent $pkg"
          fi
        done
        if [ -n "$absent" ]; then
          fail "installed by apt-get but missing afterwards:$absent"
        fi
      fi

      touch "$done_marker"

  - mode: system
    script: |
      #!/bin/bash
      # =============================================================================
      # 20-firewall.sh - default-deny egress. Runs as root inside the guest.
      #
      # The ruleset is WRITTEN here and ACTIVATED on the next boot: the user
      # provisioning scripts still need open network for their installers, so the
      # unit is enabled but not started. `ptrbox new` reboots the VM afterwards,
      # which is the moment the wall goes up.
      #
      # Widening any rule here is a security decision, not a bugfix.
      # =============================================================================
      set -eux

      if [ -f /var/lib/ptrbox/firewall.done ]; then
        exit 0
      fi

      # Root-owned + chmod 600 so the agent user can't read or edit it - which only
      # means something combined with the sudo removal in 90-nosudo.sh.
      cat >/etc/nftables-sandbox.nft <<'NFT'
      table inet sandbox {
        chain output {
          # Hook every OUTGOING packet; the verdict for anything not matched by a
          # rule below is DROP. Default-deny: we enumerate what is allowed instead
          # of trying to enumerate everything bad.
          type filter hook output priority 0; policy drop;
          oif "lo" accept                     # loopback: the VM talking to itself
                                              # (dev servers, tests, local DBs)
          ct state established,related accept # connection tracking: once a permitted
                                              # connection is open, its packets keep
                                              # flowing both ways
          # DNS: pinned to the resolvers written to /etc/resolv.conf below. Unpinned
          # port-53 egress is a covert exfiltration channel - any process could
          # smuggle data in queries to an attacker-run nameserver. Pinning narrows
          # (does not close: DNS tunneling can transit recursive resolvers) that
          # channel. Note these are v4 rules; IPv6 egress has no allow rules at all
          # in this table, so it is implicitly default-denied.
          ip daddr { 9.9.9.9, 1.1.1.1 } udp dport 53 accept
          ip daddr { 9.9.9.9, 1.1.1.1 } tcp dport 53 accept
          # THE one road out: the Squid allowlist proxy on the Mac, reached at the
          # vzNAT gateway address.
          ip daddr 192.168.5.2 tcp dport 8889 accept
        }
      }
      NFT
      chmod 600 /etc/nftables-sandbox.nft

      # systemd unit that loads the ruleset at every boot.
      # Type=oneshot: run the command once and exit (it's not a daemon).
      # RemainAfterExit: systemd still reports the unit "active" afterwards, so
      # `systemctl status sandbox-firewall` tells you the wall is up.
      cat >/etc/systemd/system/sandbox-firewall.service <<'UNIT'
      [Unit]
      Description=Default-deny egress firewall (ptrbox sandbox)
      After=network-online.target
      Wants=network-online.target
      [Service]
      Type=oneshot
      ExecStart=/usr/sbin/nft -f /etc/nftables-sandbox.nft
      RemainAfterExit=yes
      [Install]
      WantedBy=multi-user.target
      UNIT

      systemctl daemon-reload
      # "enable" = start on future boots. Deliberately NOT "systemctl start": the
      # user provisioning scripts still need open network for their installers.
      systemctl enable sandbox-firewall.service

      # Pin the resolver to match the firewall's DNS rules. A static resolv.conf made
      # immutable (chattr +i) is the distro-agnostic way to stop any network manager
      # (systemd-resolved, dhclient, networkd) from rewriting it back to the
      # DHCP-provided resolver - which the firewall would then block, breaking all
      # name resolution. This also bypasses Lima's built-in DNS relay entirely.
      rm -f /etc/resolv.conf
      # shellcheck disable=SC2043  # renders to a space-separated list of resolvers
      for ns in 9.9.9.9 1.1.1.1; do
        printf 'nameserver %s\n' "$ns" >>/etc/resolv.conf
      done
      chattr +i /etc/resolv.conf

      mkdir -p /var/lib/ptrbox
      touch /var/lib/ptrbox/firewall.done

  - mode: user
    script: |
      #!/bin/bash
      # =============================================================================
      # 30-toolchain.sh - developer toolchain. Runs as the unprivileged agent user.
      #
      # Which language runtimes land here is host-side config (one boolean per
      # runtime: PTRBOX_NODE, PTRBOX_UV, all off by default), resolved into the list
      # rendered in below and validated on the host first - the same rule as the apt
      # list in 15-extra-packages.sh, and for the same reason: a runtime list read
      # from the repo mount would let the agent decide what its own sandbox contains.
      #
      # Claude Code is not part of that list. It is installed unconditionally,
      # because it is what a ptrbox VM exists to run, and it is a native binary that
      # needs neither node nor Python.
      #
      # This must happen on the pre-firewall boot, and the done-marker guard is
      # therefore mandatory. The reason is narrower than it looks: three of the four
      # downloads below are from hosts that ARE on the allowlist
      # (.githubusercontent.com, astral.sh, claude.ai). The one that is not is
      # `nvm install`, which fetches the node tarball from nodejs.org - deliberately
      # absent from the allowlist, because provisioning is the only thing that needs
      # it. So a post-firewall re-run would get through most of this file and then
      # hang on node.
      #
      # The three installer URLs and the nvm pin are deliberately NOT config. They
      # are `curl | bash` sources; changing one should be an edit here, visible as a
      # golden diff under tests/golden/, rather than a line in a config file.
      # =============================================================================
      set -eux

      if [ -f "$HOME/.ptrbox/toolchain.done" ]; then
        exit 0
      fi

      # Rendered from host config; TOOLCHAIN is empty when neither runtime is wanted.
      TOOLCHAIN="node uv"
      NODE_VERSION="lts"

      mkdir -p "$HOME/.ptrbox"

      # What was ASKED FOR, recorded before anything is installed. vm/verify.sh reads
      # this file and requires every name in it to be on PATH, so a runtime that
      # failed to install is a failed `ptrbox new` rather than a tool someone
      # discovers is missing a week later. Writing it first is what makes it an
      # assertion instead of a self-report: if an install below dies, set -e stops
      # the script here, and the record still says the runtime was wanted.
      printf '%s\n' "$TOOLCHAIN" >"$HOME/.ptrbox/toolchain"

      # Substring match on a padded list, so "node" cannot match "nodemon".
      want() {
        case " $TOOLCHAIN " in
        *" $1 "*) return 0 ;;
        *) return 1 ;;
        esac
      }

      if want node; then
        # nvm is a shell function, not a binary, so after installing we must source
        # it into this script's shell before calling it. The pin is on the nvm
        # installer; which node it then fetches is PTRBOX_NODE_VERSION, defaulting
        # to "lts" - part of the always-fresh design.
        curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
        export NVM_DIR="$HOME/.nvm"
        # shellcheck source=/dev/null
        . "$NVM_DIR/nvm.sh"
        if [ "$NODE_VERSION" = lts ]; then
          nvm install --lts
        else
          nvm install "$NODE_VERSION"
        fi
      fi

      if want uv; then
        # uv - Python package/project manager. Also installs Python versions on
        # demand; those downloads come from GitHub releases, which IS on the
        # allowlist, so `uv python install` keeps working after the firewall is up.
        curl -LsSf https://astral.sh/uv/install.sh | sh
      fi

      # Claude Code. Installs the binary to ~/.local/bin.
      curl -fsSL https://claude.ai/install.sh | bash

      touch "$HOME/.ptrbox/toolchain.done"

  - mode: user
    script: |
      #!/bin/bash
      # =============================================================================
      # 40-userenv.sh - shell environment, git identity, Claude Code defaults.
      # Runs as the unprivileged agent user.
      # =============================================================================
      set -eux

      if [ -f "$HOME/.ptrbox/userenv.done" ]; then
        exit 0
      fi

      # Steady-state environment. Goes in ~/.profile, NOT ~/.bashrc: Debian's stock
      # .bashrc begins with an interactive-shell guard that returns early for
      # scripts, so exports appended there are invisible to non-interactive shells
      # (ssh host cmd, bash -lc, ptrbox's own verification run). .profile is read by
      # every login shell.
      cat >>"$HOME/.profile" <<'RC'
      # Load nvm (node). The nvm installer only wires itself into .bashrc, below the
      # interactive guard - invisible to scripts. Loading it here puts node on PATH
      # for every login shell, interactive or not.
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
      # Route cooperative tools (curl, npm, pip, git, claude) through the host Squid
      # proxy. This is the polite/routing layer; nftables is the enforcement layer
      # that makes the proxy the ONLY physical way out.
      export HTTPS_PROXY="http://192.168.5.2:8889"
      export HTTP_PROXY="$HTTPS_PROXY"
      # Don't proxy the VM's own local traffic (tests hitting localhost, etc.)
      export NO_PROXY="localhost,127.0.0.1"
      # Don't even attempt telemetry calls - their domains are deliberately off the
      # allowlist, so attempts would just spam TCP_DENIED in the squid log.
      export CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1
      # Where the claude binary landed.
      export PATH="$HOME/.local/bin:$PATH"
      RC

      # Interactive-only quality of life. This one goes in ~/.bashrc, BELOW the
      # stock interactive guard: prompts, aliases and banners are meaningless to
      # scripts, and here the early return works in our favor - none of this can
      # leak into `bash -lc` output or the verification run.
      cat >>"$HOME/.bashrc" <<'RC'

      # --- ptrbox ------------------------------------------------------------------
      # Make this shell unmistakably the sandbox: VM name in the prompt and in the
      # terminal title, so a host terminal and a sandbox terminal never look alike.
      if [ -f /usr/lib/git-core/git-sh-prompt ]; then
        . /usr/lib/git-core/git-sh-prompt
      fi
      # The name's color is derived from the name on the host (ptrbox_vm_color),
      # so every sandbox keeps its own hue across recreations.
      if declare -F __git_ps1 >/dev/null; then
        # Branch only - no dirty-state markers, which cost a status walk per prompt.
        PS1='\[\e[1;32m\][demo]\[\e[0m\] \[\e[1;34m\]\w\[\e[0m\]\[\e[0;36m\]$(__git_ps1 " (%s)")\[\e[0m\]\$ '
      else
        PS1='\[\e[1;32m\][demo]\[\e[0m\] \[\e[1;34m\]\w\[\e[0m\]\$ '
      fi
      case "$TERM" in
      xterm* | rxvt* | tmux* | screen*)
        PS1="\[\e]0;demo \w\a\]$PS1"
        ;;
      esac

      alias ls='ls --color=auto'
      alias grep='grep --color=auto'

      # Once per ssh login (tmux panes are non-login shells, so they stay quiet):
      # start where the work is, and say what this box is.
      if shopt -q login_shell; then
        [ "$PWD" = "$HOME" ] && cd /workspace
        printf '\e[1;32m[demo]\e[0m ptrbox sandbox - repo: /workspace, egress: allowlist proxy, sudo: off\n'
      fi
      RC

      # Silence the stock login banner, so the ptrbox line above is the only thing
      # an `ssh lima-<vm>` prints. Two things sit under it, neither ours:
      #   - "Last login: <date> from UNKNOWN". UNKNOWN is literal, not a rendering
      #     of an empty field: sshd cannot see a peer address for a connection that
      #     arrives through lima's relay, so it writes the string into wtmpdb's
      #     RemoteHost column and reads it back on the next login, forever. Nothing
      #     host-side or guest-side can make it say something true.
      #   - Debian's /etc/motd boilerplate.
      # ~/.hushlogin suppresses exactly those two (sshd's PrintLastLog and
      # PrintMotd); a Banner, were one configured, would still be shown. It costs no
      # root, unlike the sshd_config drop-in that would drop only the first line.
      touch "$HOME/.hushlogin"

      # Git identity for agent commits - set globally in the VM so the agent never
      # has to guess one (it will otherwise copy whatever it finds in git log, or
      # invent something). ptrbox fills these in from the HOST's global git config;
      # empty means the host had none, in which case leave git to complain rather
      # than commit under a made-up name. Global-in-VM lives outside the mount, so it
      # covers every repo in this VM without touching host repos.
      git_name="Example Dev"
      git_email="dev@example.com"
      if [ -n "$git_name" ]; then
        git config --global user.name "$git_name"
      fi
      if [ -n "$git_email" ]; then
        git config --global user.email "$git_email"
      fi

      # Claude Code defaults, pre-seeded so fresh VMs go straight to work:
      # - statusline-command.sh + settings.json: the model to default to ("opus" is
      #   an alias tracking the latest Opus-class model, so no updates needed on
      #   releases), the statusline that renders above the prompt, and the
      #   permission mode a session starts in
      # - permissions.defaultMode "auto": Claude Code's own default, which classifies
      #   each tool call and asks only about the ones it will not auto-approve. It is
      #   a user-level setting on purpose - repo-level settings cannot grant it, and
      #   a repo that could would be choosing its own leash. Approvals are a
      #   convenience layer here, not the containment: the VM holds under any mode,
      #   which is why this can be a default rather than a decision per sandbox. A
      #   plan or a model that does not offer auto mode falls back on its own; to opt
      #   out, edit this line and re-create.
      # - .claude.json: skip the first-run onboarding wizard AND the per-project
      #   trust dialog. Auto-trust is a deliberate call: the dialog gates loading
      #   repo-provided config (CLAUDE.md, hooks), and in this design the VM itself
      #   is the trust boundary - a malicious repo config can't reach anything the
      #   sandbox doesn't already concede.
      #   NOTE: both files are undocumented internals; format drift shows up as the
      #   wizard/dialog reappearing - safe, and the fix is to update this block
      #   rather than remove it.
      mkdir -p "$HOME/.claude"

      # The statusline. Quoted heredoc: every $var and $(...) below belongs to the
      # script at render time inside the guest, not to this provisioning shell.
      #
      # It shells out to jq (in the base package list), git, date and hostname, all
      # present. `git -C "$cwd"` reads the repo mount at runtime - which is fine
      # here in a way it would not be on the host: the agent already has execution
      # inside this VM, so a repo-triggered git exec is no escalation. The host's
      # clone is protected separately, by core.hooksPath=/dev/null.
      cat >"$HOME/.claude/statusline-command.sh" <<'STATUSLINE'
      #!/bin/sh
      # Claude Code statusLine command - styled after the Oh My Zsh "ys" theme.
      # Provisioned by ptrbox; edit vm/provision/40-userenv.sh and re-create the VM.

      input=$(cat)
      cwd=$(echo "$input" | jq -r '.workspace.current_dir')
      model=$(echo "$input" | jq -r '.model.display_name')
      remaining=$(echo "$input" | jq -r '.context_window.remaining_percentage // empty')
      transcript=$(echo "$input" | jq -r '.transcript_path // empty')

      # Context used % (color-coded: green <50, yellow 50-75, red >75)
      if [ -n "$remaining" ]; then
          used=$(echo "$remaining" | awk '{printf "%.0f", 100 - $1}')
          if [ "$used" -ge 75 ] 2>/dev/null; then
              ctx_color="\033[1;31m"
          elif [ "$used" -ge 50 ] 2>/dev/null; then
              ctx_color="\033[1;33m"
          else
              ctx_color="\033[1;32m"
          fi
      fi

      user=$(whoami)
      host=$(hostname -s)

      # Git branch (skip optional locks to avoid blocking)
      git_branch=$(git -C "$cwd" --no-optional-locks branch --show-current 2>/dev/null)

      # Git dirty indicator
      git_dirty=""
      if [ -n "$git_branch" ]; then
          if [ -n "$(git -C "$cwd" --no-optional-locks status --porcelain 2>/dev/null)" ]; then
              git_dirty="\033[1;31m*\033[0m"
          fi
      fi

      # Message count from transcript (count assistant turns)
      msg_count=""
      if [ -n "$transcript" ] && [ -f "$transcript" ]; then
          count=$(grep -c '"role":"assistant"' "$transcript" 2>/dev/null || echo "0")
          if [ "$count" -gt 0 ] 2>/dev/null; then
              msg_count="$count"
          fi
      fi

      # Timestamp (statusline refreshes after each response, so this is ~last response time)
      time_str=$(date +%H:%M:%S)

      # Bold blue "#"
      part_hash="\033[1;34m#\033[0m"
      # Cyan user
      part_user="\033[0;36m${user}\033[0m"
      # Green host
      part_host="\033[0;32m${host}\033[0m"
      # Bold yellow cwd
      part_cwd="\033[1;33m${cwd}\033[0m"
      # Bold magenta model
      part_model="\033[1;35m${model}\033[0m"

      line="${part_hash} ${part_user} @ ${part_host} in ${part_cwd}"

      if [ -n "$git_branch" ]; then
          part_git="on \033[0;34mgit\033[0m:\033[0;36m${git_branch}\033[0m${git_dirty}"
          line="${line} ${part_git}"
      fi

      line="${line} [${time_str}] | ${part_model}"

      if [ -n "$used" ]; then
          line="${line} | ${ctx_color}${used}%\033[0m"
      fi

      if [ -n "$msg_count" ]; then
          line="${line} | \033[0;36m${msg_count} msgs\033[0m"
      fi

      printf '%b' "$line"
      STATUSLINE
      chmod 755 "$HOME/.claude/statusline-command.sh"

      # $HOME rather than a literal path: Lima's guest home carries a
      # version-dependent suffix and must never be hardcoded.
      printf '{"model": "opus", "permissions": {"defaultMode": "auto"}, "statusLine": {"type": "command", "command": "%s/.claude/statusline-command.sh"}}\n' \
        "$HOME" >"$HOME/.claude/settings.json"

      cat >"$HOME/.claude.json" <<'JSON'
      {
        "hasCompletedOnboarding": true,
        "projects": {
          "/workspace": {
            "hasTrustDialogAccepted": true,
            "hasCompletedProjectOnboarding": true
          }
        }
      }
      JSON

      mkdir -p "$HOME/.ptrbox"
      touch "$HOME/.ptrbox/userenv.done"

  - mode: system
    script: |
      #!/bin/bash
      # =============================================================================
      # 90-nosudo.sh - remove passwordless root. Runs as root inside the guest.
      #
      # THE step that makes the firewall real. Lima images grant the default user
      # passwordless sudo (NOPASSWD:ALL) - convenient for normal Lima use, fatal
      # here: the agent could run `sudo nft flush ruleset` and walk straight past the
      # wall. (vzNAT would then hand it direct, unfiltered internet - Squid only
      # filters what is forced through it.)
      #
      # Consequence: NO root access inside this VM, ever. Any root-level change (new
      # apt package, firewall tweak) = edit the template, delete the VM, re-create.
      # That is the intended workflow; the template stays the single source of truth.
      #
      # Deliberately NOT guarded by a done-marker: this runs on every boot, so the
      # removal is re-asserted even if something in the guest puts a sudoers file
      # back.
      # =============================================================================
      set -eux

      rm -f /etc/sudoers.d/90-cloud-init-users
      # Belt-and-suspenders: some cloud images name the sudoers drop-in differently;
      # remove anything granting NOPASSWD.
      grep -rl 'NOPASSWD' /etc/sudoers.d/ 2>/dev/null | xargs -r rm -f
      # grep exits 1 when it matches nothing, which is the normal steady state.
      exit 0

# --- Readiness probe ---------------------------------------------------------
# limactl start blocks until probes pass (or time out), so ptrbox knows
# provisioning finished before it reboots the VM. Kept minimal: git arriving
# via the system script implies apt completed; the user-script tools get
# checked properly by vm/verify.sh afterwards.
probes:
  - description: "toolchain ready"
    script: |
      #!/bin/bash
      command -v git >/dev/null
