name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install shellcheck (lints the guest scripts)
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: make check
